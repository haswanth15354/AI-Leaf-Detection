# Server Configuration
server.port=8080
server.servlet.context-path=/

# Multipart / File Upload Limits (Support up to 50MB for high-resolution agricultural drone & macro leaf photos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Google Gemini AI Configuration
# Set your Gemini API key via environment variable: export GEMINI_API_KEY="your-api-key"
# or configure directly below for local testing
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.endpoint=https://generativelanguage.googleapis.com/v1beta/models

# CORS Configuration (Allowed frontend origin URLs)
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

# Logging Configuration
logging.level.root=INFO
logging.level.com.florascan=DEBUG
